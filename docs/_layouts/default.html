<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <title>{{ page.title | escape }} · {{ site.title | escape }}</title>
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
</head>
<body>
  <a class="skip-link" href="#main">본문으로 바로가기</a>
  <header class="site-header">
    <div class="shell header-inner">
      <a class="brand" href="{{ '/' | relative_url }}"><span class="brand-symbol" aria-hidden="true">돌</span><span>돌돌소프트<span class="brand-caption">정책 센터</span></span></a>
      <a class="header-contact" href="mailto:latency.sprint@gmail.com">문의하기 <span aria-hidden="true">↗</span></a>
    </div>
  </header>
  <main id="main" class="shell" tabindex="-1">{{ content }}</main>
  <footer class="site-footer">
    <div class="shell footer-inner">
      <div><strong>돌돌소프트</strong><p>대표 신기록 · <a href="mailto:latency.sprint@gmail.com">latency.sprint@gmail.com</a></p></div>
      <div class="footer-note"><p>서비스별 정책과 변경 이력을 한곳에서 확인하세요.</p><p>이 웹사이트는 GitHub Pages에서 제공됩니다.<br><a href="{{ '/site-privacy/' | relative_url }}">정책 사이트 개인정보 안내</a></p></div>
    </div>
  </footer>
</body>
</html>
